[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-stock-picker"
version = "0.2.0"
description = "S&P 500 quant ranking with momentum, volatility, P/E, and FinBERT sentiment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "lxml>=4.9",           # pandas read_html backend
  "yfinance>=0.2.30",
  "gnews>=0.3.6",        # Google News RSS headlines
  "torch>=2.0",
  "transformers>=4.35",
  "sentencepiece>=0.1.99",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
